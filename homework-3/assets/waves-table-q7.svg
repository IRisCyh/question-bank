<svg xmlns="http://www.w3.org/2000/svg" width="760" height="278" viewBox="0 0 760 278"><rect width="100%" height="100%" fill="#ffffff"/><g stroke="#111" stroke-width="1.4" fill="none" shape-rendering="crispEdges"><rect x="54" y="1" width="705" height="58"/><line x1="407" y1="1" x2="407" y2="277"/><rect x="1" y="59" width="758" height="58"/><rect x="1" y="117" width="758" height="58"/><rect x="1" y="175" width="758" height="44"/><rect x="1" y="219" width="758" height="58"/><line x1="54" y1="59" x2="54" y2="277"/></g><text x="230.5" y="34.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111">Progressive wave</text><text x="583.5" y="34.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111">Stationary wave</text><text x="27.5" y="92.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111">A</text><text x="230.5" y="93.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111">Some of the particles do not vibrate.</text><text x="583.5" y="84.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111">All the particles vibrate in phase with<tspan x="583.5" dy="18">each other.</tspan></text><text x="27.5" y="150.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111">B</text><text x="230.5" y="142.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111">None of the particles vibrate with the<tspan x="230.5" dy="18">same amplitude.</tspan></text><text x="583.5" y="142.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111">All the particles vibrate with the same<tspan x="583.5" dy="18">amplitude.</tspan></text><text x="27.5" y="201.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111">C</text><text x="230.5" y="202.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111">All the particles vibrate.</text><text x="583.5" y="202.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111">Some of the particles do not vibrate.</text><text x="27.5" y="252.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111">D</text><text x="230.5" y="244.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111">All the particles vibrate in phase with<tspan x="230.5" dy="18">each other.</tspan></text><text x="583.5" y="244.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#111">None of the particles vibrate in phase<tspan x="583.5" dy="18">with each other.</tspan></text></svg>